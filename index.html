<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paraguas Inteligente · UNAPEC</title>
    <link rel="icon" href="images/logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/illustration.css" />
    <link rel="stylesheet" href="css/effects.css" />
  </head>
  <body>
    <!-- Shared SVG gradients, clip paths and filters used by the umbrella illustrations -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <svg width="0" height="0" style="position: absolute">
          <defs>
            <radialGradient id="gB" gradientUnits="userSpaceOnUse" cx="310" cy="86" r="360">
              <stop offset="0" stop-color="#0a2459" />
              <stop offset=".55" stop-color="#123f8e" />
              <stop offset="1" stop-color="#2468cc" />
            </radialGradient>
            <linearGradient id="gD" x1="0" y1="0" x2="0" y2="1">
              <stop stop-color="#555b68" />
              <stop offset="1" stop-color="#14161b" />
            </linearGradient>
            <linearGradient id="gM" x1="0" x2="1">
              <stop stop-color="#555c69" />
              <stop offset=".35" stop-color="#eef1f6" />
              <stop offset=".6" stop-color="#8a92a1" />
              <stop offset="1" stop-color="#2b2f38" />
            </linearGradient>
            <linearGradient id="gG" x1="0" x2="1">
              <stop stop-color="#08090b" />
              <stop offset=".25" stop-color="#2e323a" />
              <stop offset=".6" stop-color="#111317" />
              <stop offset="1" stop-color="#050506" />
            </linearGradient>
            <linearGradient id="gS" x1="0" y1="0" x2="0" y2="1">
              <stop stop-color="#5eb0ff" />
              <stop offset="1" stop-color="#0a2a66" />
            </linearGradient>
            <radialGradient id="gW">
              <stop stop-color="#fff" />
              <stop offset=".5" stop-color="#d6e8ff" stop-opacity=".9" />
              <stop offset="1" stop-color="#8fbcff" stop-opacity=".5" />
            </radialGradient>
            <linearGradient id="gSh" x1="0" x2="1">
              <stop stop-color="#fff" stop-opacity="0" />
              <stop offset=".5" stop-color="#fff" stop-opacity=".18" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <clipPath id="cB">
              <path
                d="M595,152Q544.73625,185.43725 511.5,221.3Q407.22375,232.72225 310,250Q212.77625,232.72225 108.5,221.3Q75.26375,185.43725 25,152Q75.26375,118.56275 108.5,82.7Q212.77625,71.27775 310,54Q407.22375,71.27775 511.5,82.7Q544.73625,118.56275 595,152Z"
              />
            </clipPath>
            <clipPath id="cT"><rect x="298" y="390" width="24" height="42" rx="6" /></clipPath>
          </defs>
        </svg>
      </defs>
    </svg>

    <!-- Animated ambient background (silver blobs) -->
    <div id="bg">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>

    <!-- Progress bar, slide counter, author tag and first-visit hint -->
    <div class="pr" id="pr"></div>
    <div class="ct" id="ct"></div>
    <div class="who" id="who"></div>
    <div class="hint">← → teclas · toca izquierda / derecha</div>

    <!-- Scripts: order matters (later files use functions from earlier ones) -->
    <script src="js/umbrella.js"></script>
    <script src="js/stages.js"></script>
    <script src="js/slides.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/navigation.js"></script>
  </body>
</html>
