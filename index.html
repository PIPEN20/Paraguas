<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paraguas Inteligente · UNAPEC</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#f2f4f7;--mut:#aab0bb;--blue:#4da3ff;--card:rgba(225,229,236,.92);--cardink:#12151b;--purple:#a855f7;box-sizing:border-box}
*{box-sizing:inherit;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
h1,h2,h3{font-family:'Chakra Petch',Inter,sans-serif}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(60px);opacity:.5;will-change:transform;
background:conic-gradient(from 90deg,#e8ecf2,#5b6270,#0c0d10,#cfd5df,#3a3f4a,#e8ecf2)}
.b1{left:-38vmax;top:-38vmax;animation:d1 18s ease-in-out infinite alternate}
.b2{right:-42vmax;bottom:-45vmax;animation:d2 22s ease-in-out infinite alternate;opacity:.4}
.b3{width:34vmax;height:34vmax;left:30vw;top:25vh;opacity:.12;background:radial-gradient(#4da3ff,transparent 70%);animation:d3 14s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(8vmax,6vmax) rotate(70deg) scale(1.1)}}
@keyframes d2{to{transform:translate(-9vmax,-5vmax) rotate(-80deg) scale(1.08)}}
@keyframes d3{to{transform:translate(12vw,-8vh) scale(1.3)}}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,.85))}
.s{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(18px,4vw,56px) clamp(18px,6vw,90px) clamp(46px,7vh,70px);
overflow-y:auto;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(calc(var(--dir,1)*60px)) scale(.98);filter:blur(8px);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1),filter .6s,visibility 0s .7s}
.s.on{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}
.s.out{transform:translateX(calc(var(--dir,1)*-60px)) scale(.98)}
.s>*{max-width:1200px;width:100%;margin-inline:auto}
.s.on .rv{animation:rv .7s both cubic-bezier(.2,.8,.2,1)}
.s.on .rv:nth-child(2){animation-delay:.12s}.s.on .rv:nth-child(3){animation-delay:.22s}.s.on .rv:nth-child(4){animation-delay:.32s}.s.on .rv:nth-child(5){animation-delay:.42s}
@keyframes rv{from{opacity:0;transform:translateY(22px)}}
h2{font-size:clamp(24px,4.6vw,52px);letter-spacing:.04em;margin-bottom:clamp(14px,3vh,30px);display:flex;align-items:center;gap:.5em;justify-content:space-between}
h2 i{font-style:normal;font-size:.9em;filter:drop-shadow(0 0 14px currentColor)}
.sub{color:var(--mut);margin-top:-.4em;margin-bottom:1em;font-size:clamp(14px,1.8vw,20px)}
.grid{display:grid;gap:clamp(10px,1.6vw,20px);grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.card{background:var(--card);color:var(--cardink);border-radius:18px;padding:clamp(14px,2vw,26px);backdrop-filter:blur(6px)}
.card .ic{font-size:clamp(26px,3.4vw,40px);display:block;margin-bottom:.3em}
.card h3{font-size:clamp(17px,2vw,24px);margin-bottom:.3em}
.card p{font-size:clamp(13px,1.5vw,18px);line-height:1.45;color:#2b303a}
.dark{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid rgba(255,255,255,.15)}
.dark p{color:#d4d8e0}
.dark h3{color:var(--blue)}
.who{position:fixed;left:clamp(18px,6vw,90px);bottom:clamp(14px,3vh,28px);z-index:3;font-size:clamp(11px,1.3vw,15px);color:var(--mut);letter-spacing:.06em;opacity:0;transition:opacity .5s}
.cover{text-align:left}.cover img{width:min(300px,60vw);display:block;margin-bottom:6vh}
.cover h1{font-size:clamp(40px,10vw,120px);line-height:.95;letter-spacing:.03em;background:linear-gradient(100deg,#fff,#9aa3b2 50%,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:200% 0}}
.cover p{margin-top:2.5vh;color:var(--mut);font-size:clamp(13px,1.7vw,20px);line-height:1.7}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(14px,3vw,40px);align-items:center}
.two .grid{grid-template-columns:1fr}
@media(max-width:760px){.two{grid-template-columns:1fr}.um{max-height:30vh;margin:auto}}
.um{width:100%;max-height:60vh;animation:fl 5s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-8px)}}
.stg{animation:st 6s ease-in-out infinite}@keyframes st{0%{opacity:.3}8%,24%{opacity:1}34%,100%{opacity:.3}}
.um .ar{stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.big{font-size:clamp(16px,2.3vw,28px);line-height:1.5;display:grid;gap:1.1em}
.big p{border-left:3px solid var(--blue);padding-left:1em}
.pr{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--blue),#fff);z-index:5;transition:width .5s}
.ct{position:fixed;right:clamp(14px,3vw,36px);bottom:clamp(14px,3vh,28px);z-index:5;font-size:13px;color:var(--mut);font-family:'Chakra Petch',sans-serif}
.hint{position:fixed;inset:auto 0 8vh;text-align:center;z-index:6;color:#fff;font-size:14px;pointer-events:none;animation:hd 5s forwards}
@keyframes hd{70%{opacity:1}to{opacity:0}}
.fx{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .9s;pointer-events:none;overflow:hidden}
.fx.on{opacity:1}.fx:not(.on) *{animation-play-state:paused}
.fx i,.fx div{will-change:transform}
.rain{position:absolute;inset:-30%}
.rain i{position:absolute;top:0;left:var(--x);width:2px;height:var(--h);background:linear-gradient(transparent,rgba(255,255,255,.7));animation:fall var(--t) linear var(--d) infinite}
@keyframes fall{from{transform:translateY(-10vh)}to{transform:translateY(170vh)}}
.rg i{position:absolute;left:var(--x);top:var(--y);width:120px;height:120px;margin:-60px;border:2px solid rgba(255,255,255,.75);border-radius:50%;animation:rg var(--t) ease-out var(--d) infinite}
@keyframes rg{from{transform:scale(.1);opacity:.9}to{transform:scale(var(--s));opacity:0}}
.spk{position:absolute;left:50%;top:50%;width:120vmax;height:120vmax;margin:-60vmax;background:repeating-conic-gradient(rgba(255,255,255,.18) 0 4deg,transparent 4deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 5%,transparent 65%);mask-image:radial-gradient(circle,#000 5%,transparent 65%);animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sweep{position:absolute;top:-20%;bottom:-20%;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:sw 10s ease-in-out infinite}
@keyframes sw{to{transform:translateX(520%) skewX(-20deg)}}
.cl{position:absolute;width:40vmax;height:16vmax;border-radius:50%;background:rgba(255,255,255,.2);filter:blur(30px);left:var(--x);top:var(--y);animation:cd var(--t) ease-in-out infinite alternate}
@keyframes cd{to{transform:translateX(14vw)}}
.rise i{position:absolute;bottom:0;left:var(--x);width:1.5px;height:var(--h);background:linear-gradient(rgba(255,255,255,.8),transparent);animation:ri var(--t) linear var(--d) infinite}
@keyframes ri{from{transform:translateY(140px)}to{transform:translateY(-110vh)}}
.flow i{position:absolute;left:0;top:var(--y);width:var(--w);height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75));animation:fw var(--t) linear var(--d) infinite}
@keyframes fw{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
.bars{position:absolute;inset:auto 0 0 0;height:55%;display:flex;gap:2%;padding:0 4%;align-items:flex-end}
.bars i{flex:1;height:var(--h);background:linear-gradient(rgba(255,255,255,.3),transparent);transform-origin:bottom;animation:bar var(--t) ease-in-out var(--d) infinite alternate}
@keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.net{position:absolute;inset:0;width:100%;height:100%}
.dl{animation:dl 6s linear infinite}@keyframes dl{to{stroke-dashoffset:-20}}
.nd{fill:rgba(255,255,255,.7);animation:nd 3s ease-in-out infinite alternate}@keyframes nd{from{opacity:.2}to{opacity:.9}}
.um{max-width:760px;margin-inline:auto}
.fl,.fl2{fill:none;stroke:#52b9ff;stroke-width:3;stroke-dasharray:9 13;stroke-linecap:round;animation:fd 1.1s linear infinite}
.fl2{stroke-width:8;opacity:.18}@keyframes fd{to{stroke-dashoffset:-22}}
.pl{animation:pu 2.2s ease-in-out infinite alternate}@keyframes pu{from{opacity:.25}to{opacity:1}}
.tw{animation:tw 4s ease-in-out infinite alternate}@keyframes tw{from{opacity:.65}to{opacity:1}}
.sh{animation:shm 7s linear infinite}@keyframes shm{from{transform:translateX(0) skewX(-20deg)}to{transform:translateX(900px) skewX(-20deg)}}
.wl{animation:wl 5s ease-in-out infinite alternate}@keyframes wl{to{transform:translateY(-10px)}}
.wv{animation:wv 2s linear infinite}@keyframes wv{to{transform:translateX(-24px)}}
.dp{animation:dp 1.4s ease-in infinite}@keyframes dp{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.rp{transform-box:fill-box;transform-origin:center;animation:rp 3s ease-out infinite}@keyframes rp{from{transform:scale(.4);opacity:.8}to{transform:scale(3.6);opacity:0}}
.jt{animation:jt 2s linear infinite}@keyframes jt{0%,40%,100%{transform:translateX(0)}5%,15%,25%,35%{transform:translateX(-1.5px)}10%,20%,30%{transform:translateX(1.5px)}}
.vb{fill:none;stroke:#dfe4ec;stroke-width:3;stroke-linecap:round;animation:pu .5s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body>
